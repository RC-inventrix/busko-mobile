  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^2.1.0
  maps_toolkit: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png